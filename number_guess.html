<!DOCTYPE html>
<html>
<head>
    <title>Number Guessing Game</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
            padding-top: 100px;
        }

        .box {
            background: white;
            width: 350px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            color: #333;
        }

        input {
            padding: 12px;
            width: 200px;
            margin: 15px;
        }

        button {
            padding: 10px 20px;
            background: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Guess the Number</h1>

    <p>Guess a number between 1 and 100</p>

    <input type="number" id="guess" placeholder="Enter number">

    <br>

    <button onclick="checkGuess()">Guess</button>

    <p id="result"></p>

    <p>Attempts: <span id="attempts">0</span></p>

</div>


<script>

    let number = Math.floor(Math.random() * 100) + 1;

    let attempts = 0;

    function checkGuess() {

        let guess = Number(document.getElementById("guess").value);

        attempts++;

        document.getElementById("attempts").innerHTML = attempts;

        if (guess == number) {

            document.getElementById("result").innerHTML =
                "🎉 Correct! You guessed the number!";

        }
        else if (guess > number) {

            document.getElementById("result").innerHTML =
                "⬇️ Too High! Try again.";

        }
        else {

            document.getElementById("result").innerHTML =
                "⬆️ Too Low! Try again.";

        }
    }

</script>

</body>
</html>
