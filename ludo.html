<!DOCTYPE html>
<html>
<head>
    <title>Ludo</title>
    <link rel="stylesheet" href="ludo.css">
</head>
<body>

<div class="board">

    <!-- 4 HOME -->
    <div class="home green-home">
        <div class="home-box">
            <i></i><i></i>
            <i></i><i></i>
        </div>
    </div>

    <div class="home yellow-home">
        <div class="home-box">
            <i></i><i></i>
            <i></i><i></i>
        </div>
    </div>

    <div class="home red-home">
        <div class="home-box">
            <i></i><i></i>
            <i></i><i></i>
        </div>
    </div>

    <div class="home blue-home">
        <div class="home-box">
            <i></i><i></i>
            <i></i><i></i>
        </div>
    </div>


    <!-- TOP PATH -->
    <div class="top-path">
        <div></div><div></div><div></div>
        <div></div><div class="yellow"></div><div></div>
        <div></div><div class="yellow"></div><div></div>
        <div></div><div class="yellow"></div><div></div>
        <div></div><div class="yellow"></div><div></div>
        <div></div><div class="yellow"></div><div></div>
        <div></div><div class="yellow"></div><div></div>
        <div></div><div class="yellow"></div><div></div>
        <div></div><div></div><div></div>
    </div>


    <!-- BOTTOM PATH -->
    <div class="bottom-path">
        <div></div><div class="red"></div><div></div>
        <div></div><div class="red"></div><div></div>
        <div></div><div class="red"></div><div></div>
        <div></div><div class="red"></div><div></div>
        <div></div><div class="red"></div><div></div>
        <div></div><div class="red"></div><div></div>
        <div></div><div class="red"></div><div></div>
        <div></div><div class="red"></div><div></div>
        <div></div><div></div><div></div>
    </div>


    <!-- LEFT PATH -->
    <div class="left-path">
        <div></div><div></div><div></div>
        <div></div><div class="green"></div><div></div>
        <div></div><div class="green"></div><div></div>

        <div></div><div></div><div></div>
        <div></div><div></div><div></div>

        <div></div><div></div><div></div>
        <div></div><div></div><div></div>

        <div></div><div></div><div></div>
        <div></div><div></div><div></div>

        <div></div><div></div><div></div>
    </div>


    <!-- RIGHT PATH -->
    <div class="right-path">
        <div></div><div></div><div></div>
        <div></div><div class="blue"></div><div></div>
        <div></div><div class="blue"></div><div></div>

        <div></div><div></div><div></div>
        <div></div><div></div><div></div>

        <div></div><div></div><div></div>
        <div></div><div></div><div></div>

        <div></div><div></div><div></div>
        <div></div><div></div><div></div>

        <div></div><div></div><div></div>
    </div>


    <!-- CENTER -->
    <div class="center">

        <div class="triangle green-triangle"></div>
        <div class="triangle yellow-triangle"></div>
        <div class="triangle red-triangle"></div>
        <div class="triangle blue-triangle"></div>

    </div>

</div>

</body>
</html>
